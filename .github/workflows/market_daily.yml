name: Daily market MA120 email report

on:
  workflow_dispatch:

  schedule:
    # UTC 22:30 = 台灣時間隔天 06:30
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: daily-market-report
  cancel-in-progress: false

jobs:
  market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Gmail secret
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          if [ -z "$SMTP_APP_PASSWORD" ]; then
            echo "錯誤：尚未設定 SMTP_APP_PASSWORD"
            exit 1
          fi

          echo "SMTP_APP_PASSWORD 已設定"

      - name: Collect market data and send email
        env:
          SMTP_USERNAME: ab123ab456g@gmail.com
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}

          EMAIL_TO: ab123ab456g@gmail.com
          EMAIL_ENABLED: "true"

          # 第一次測試設 false，確保即使資料重複也會寄信
          EMAIL_SEND_ONLY_WHEN_NEW: "true"

          TZ: Asia/Taipei

        run: python market_daily.py

      - name: Commit updated market data
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "沒有新的市場資料需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "data: update daily market report"
          git push
